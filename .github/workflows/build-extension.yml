name: Build the Claude Desktop extension

# Builds the self-contained program on a Mac and on Windows, packs both into
# dist/Clause-Analyser.mcpb and saves that file back to the repository.
on:
  push:
    branches: [main]
    paths-ignore: ["dist/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  program:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]" pyinstaller
      - run: python -m pytest -q
      - run: python -m scripts.build_binary
      - uses: actions/upload-artifact@v4
        with:
          name: program-${{ matrix.os }}
          path: dist-bin/
          if-no-files-found: error

  extension:
    needs: program
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          path: dist-bin
          merge-multiple: true
      - run: python -m scripts.build_extension dist dist-bin
      - name: Save the extension file to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/Clause-Analyser.mcpb
          git diff --cached --quiet || (git commit -m "chore: rebuild Claude Desktop extension [skip ci]" && git push)
